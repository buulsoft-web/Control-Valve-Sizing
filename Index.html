<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globe valve forces</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--bd:#d5d9df;--hi:#d9382e;--lo:#2a6fd6;--mid:#9aa0a8;--lg:#d3d6db;--pos:#2e9b57;--neg:#d9822e;--hi4:color-mix(in srgb,var(--hi) 40%,var(--card));--lo4:color-mix(in srgb,var(--lo) 40%,var(--card))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa0a8;--bd:#3a4048;--hi:#ff6b5e;--lo:#6aa3ff;--mid:#6b7078;--lg:#4b5059}}
html,body{height:100%;margin:0}
.tb{display:flex;justify-content:space-between;align-items:baseline;padding:1px 6px;font-size:13px;font-weight:700;white-space:nowrap}
.tb span:last-child{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:400;color:var(--mu)}
.tb .ub{padding:3px 8px;font-size:11px}
body{background:var(--bg);color:var(--tx);font:12px system-ui,sans-serif;padding:4px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px}
.in{display:flex;flex-direction:column;gap:3px}
.in .r:first-child{grid-template-columns:1fr}
.sr.p{grid-template-columns:54px 1fr 110px}
.sr>.f{justify-content:flex-end}
.sr>.f input{flex:none;width:50px}
.sr.q{grid-template-columns:2fr 1fr 130px;gap:4px;align-items:end}
.sr.q>span{padding-bottom:13px}
.sr.q>label{margin-bottom:4px}
.sr.p.r2{grid-template-columns:1fr 63px 63px;gap:4px;align-items:end}
.sr.p.r2>label{margin-bottom:4px}
.fc{display:flex;flex-direction:column;min-width:0}
.fc small{font-size:8px;color:var(--mu);white-space:nowrap}
.fc input{width:100%;min-width:0;box-sizing:border-box;font:inherit;font-size:14px;padding:6px 3px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.q .dual{margin:0}
#fth{background:var(--neg);width:38px}
.fr{display:flex;flex-direction:column;min-width:0}
.fr small{font-size:9px;color:var(--mu);white-space:nowrap}
.fr input[type=range]{width:100%;margin:0;height:26px}
.dual{position:relative;height:40px;margin:0;touch-action:none;cursor:pointer}
.dual::before{content:'';position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--lg)}
.dual .seg{position:absolute;top:50%;height:6px;margin-top:-3px;background:var(--mid)}
.dual .th{position:absolute;top:50%;width:44px;height:32px;transform:translate(-50%,-50%);border-radius:16px;color:#fff;font:600 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:none}
#thin{background:var(--hi)}#thout{background:var(--lo)}#sth{background:var(--neg)}
.sr{display:grid;grid-template-columns:44px 1fr 84px;align-items:center;gap:6px;font-size:11px;color:var(--mu);white-space:nowrap}
.sr input[type=range]{width:100%;margin:0}
.ub{font-size:11px;padding:6px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);white-space:nowrap}
.sr>span:last-of-type{text-align:right}
input[type=range]{height:32px}
.in.col{display:none}
.btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.btns button{font-size:11px;white-space:nowrap;padding:4px 2px;min-height:30px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.sym{position:relative;height:32px;border-radius:16px;background:var(--lg);border:1px solid var(--bd);touch-action:none;cursor:ew-resize}
.sym .bar{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);border-radius:16px}
.sym .h::before,.sym .h::after{content:'';position:absolute;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--card)}
.sym .h::before{left:4px}.sym .h::after{right:4px}
.r{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.f{display:flex;align-items:center;gap:3px;color:var(--mu);font-size:11px;white-space:nowrap;min-width:0}
.f input,.f select{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;padding:6px 4px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.f input[type=range]{padding:0}
.mid{flex:1;min-height:0;display:flex;gap:4px}
.sk{flex:1.2;min-width:0;display:flex;flex-direction:row;gap:2px}
.pv{display:flex;flex-direction:column;align-items:center;width:34px;font-size:10px;color:var(--mu);padding:2px 0;white-space:nowrap}
.pv input[type=range]{writing-mode:vertical-lr;direction:rtl;flex:1;height:auto;width:24px;margin:4px 0;min-height:0}
.sk svg{flex:1;min-width:0;min-height:0}
.tg{display:flex;flex-direction:column;justify-content:center;gap:5px;width:62px;font-size:11px;color:var(--mu)}
.tg b{font-weight:600;margin-top:4px}
.sw{display:flex;flex-direction:column;padding:2px;gap:2px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.sw span{display:none;padding:11px 0;border-radius:10px;font-size:14px}
.sw span.on{display:block;background:var(--tx);color:var(--bg);font-weight:600}
.cc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cc .card{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:1px}
.lb{position:absolute;left:5px;top:3px;z-index:1;font-style:normal;font-size:11px;color:var(--mu)}
svg{width:100%;height:100%;min-height:0;display:block}
.ch{position:relative;height:30%;min-height:110px;padding:0;overflow:hidden}
@media(min-width:600px){ /* pc: telefoonverhouding, gecentreerd */
  html{background:color-mix(in srgb,var(--bg) 88%,#000)}
  body{max-width:calc(100vh*.46);margin:0 auto;border:1px solid var(--bd);border-radius:14px}
}
.b3{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.b3 button{font-size:12px;min-height:34px;padding:2px;line-height:1.15;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}

.v2{display:none;flex:1;min-height:0;flex-direction:column;gap:4px;padding:2px}
body.s2 .v2{display:flex}
body.s2 .mid,body.s2 .ch,body.s2>.b3{display:none}
#mc{position:absolute;left:6px;top:40px;z-index:2;background:var(--card);border:1px solid var(--bd);border-radius:6px;opacity:.94;touch-action:none;cursor:crosshair}
.vt button{font-size:15px;min-height:58px}
#tw{flex:1;min-height:0;position:relative}
#mw{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:6px;opacity:.95}
#tc{display:block;touch-action:none;cursor:crosshair}
.tl{display:flex;gap:10px;font-size:11px;color:var(--mu);justify-content:center;flex-wrap:wrap}
.tl i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* pc-indeling: invoer en waterfall links, klep + cirkels en xy-plot rechts; niet full width */
body.wide{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:430px 1fr;grid-template-rows:auto auto auto auto 1fr;gap:6px;padding:8px;height:min(100vh,980px);border:1px solid var(--bd);border-radius:14px}
body.wide .tb{grid-column:1/-1}
body.wide .in{grid-column:1;grid-row:2}
body.wide #pc{grid-column:1;grid-row:3}
body.wide .b3{grid-column:1;grid-row:4;grid-template-columns:repeat(3,1fr)}
body.wide .mid{grid-column:2;grid-row:2/5;min-height:0;contain:size}
body.wide .ch{grid-column:1;grid-row:5;height:auto;min-height:0}
body.wide .v2{grid-column:2;grid-row:5;display:flex;min-height:0}
body.s2{padding-left:2px;padding-right:2px}
body.wide .vt,body.wide #mc,body.wide #mw,body.wide .b3 button[data-k=trend]{display:none}
</style></head><body>
<div class="tb"><span>Globe valve Forces Visualized</span><span>by BuulSoft '26</span></div>

<div class="card in">
<div class="r">
<div class="sr"><span>Plug</span><input id="plugs" type="range" min="0" max="1000" step="1" value="462"><input id="plug" type="hidden" value="16"><span id="plugv"></span></div>
<div class="sr"><span>Stem</span><div class="sym" id="stemT"><div class="bar"></div><div class="bar h"></div></div><span id="stemv"></span><input id="stem" type="hidden" value="50"></div>
<div class="sr"><span>Seat</span><div class="sym" id="seatT"><div class="bar h"></div><div class="bar"></div></div><span id="seatv"></span><input id="seat" type="hidden" value="90"></div>
</div>
<div class="r">


</div>
<div class="r">



</div>
</div>
<div class="card" id="pc">
<div class="sr p q"><div class="fr"><small>F[spring]</small><div class="dual" id="sT"><div class="th" id="sth"></div></div></div><div class="fr"><small>F[friction]</small><div class="dual" id="fT"><div class="th" id="fth"></div></div><input id="fric" type="hidden" value="1"></div><label class="f">MAST<input id="mast" type="number" step="0.1" value="12.5" title="Follows 250% of spring force when the spring changes; can be edited"><span>[kN]</span></label><input id="spring" type="hidden" value="5"></div>
<div class="sr p r2"><div class="fr"><small>Process [bar]</small><div class="dual" id="pT"><div class="seg"></div><div class="th" id="thin"></div><div class="th" id="thout"></div></div></div><label class="fc"><small>Max Operating</small><input id="pmaxop" type="number" value="100" step="0.1" inputmode="decimal"></label><label class="fc"><small>Max Shut Off</small><input id="pmax" type="number" value="135" step="0.1" inputmode="decimal"></label><input id="pin" type="hidden" value="75"><input id="pout" type="hidden" value="70"></div>
<div class="btns"><button data-c="op" id="bop"></button><button data-c="maxin">Max in</button><button data-c="maxout">Max out</button><button data-c="z0">0 dP @0</button><button data-c="zm">0 dP @Max</button></div>
</div>

<div class="mid">
<div class="card sk"><input id="flow" type="hidden" value="over"><input id="fail" type="hidden" value="close"><div class="pv"><span>100%</span><input id="pos" type="range" min="0" max="100" value="0" disabled title="Valve position (0% only for now)"><span>0%</span></div><div class="pv"><span id="supplyv"></span><input id="supplys" type="range" min="0" max="1000" step="1" value="452" title="Actuator air pressure (0-6 bar)"><input id="supply" type="hidden" value="4.2"><span>0</span></div><svg id="sketch" viewBox="0 0 200 264"></svg></div>
<div class="cc">
<div class="card"><i class="lb">Top view</i><svg id="top" viewBox="4 4 192 192"></svg></div>
<div class="card"><i class="lb">Bottom view</i><svg id="bot" viewBox="4 4 192 192"></svg></div>
</div>
</div>

<div class="b3"><button data-k="trend"></button><button data-k="flow"></button><button data-k="fail"></button><button data-k="dir"></button></div>
<div class="card ch"><svg id="chart"></svg><canvas id="mc"></canvas></div>
<div class="card v2"><div class="vt b3"><button data-k="trend"></button><button data-k="flow"></button><button data-k="fail"></button><button data-k="dir"></button></div><div id="tw"><canvas id="tc"></canvas><svg id="mw"></svg></div>
<div class="tl"><span><i style="background:#2e9b57"></i>SF &gt; 150%</span><span><i style="background:#e6b800"></i>130-150%</span><span><i style="background:#f08a1c"></i>110-130%</span><span><i style="background:#d9382e"></i>&lt; 110%</span><span><i style="background:#7a1010"></i>negative</span><span><i style="background:#8e4fc2"></i>&gt; MAST</span></div></div>

<script>
const $=id=>document.getElementById(id), N=id=>parseFloat($(id).value)||0;
const NS='http://www.w3.org/2000/svg';
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}

function dia(){ // seat en stem = % van plug
  const p=pmm(),s=p*N('seat')/100,t=p*N('stem')/100;
  // spring max = 2x worst case sluitkracht: Pmax·A_stem + (Pmax-Pout)·A_seat + friction (flow Under)
  const need=(N('pmax')*Math.PI/4*t*t+Math.abs(N('pmax')-N('pout'))*Math.PI/4*s*s)*1e-4+N('fric');
  $('spring').max=Math.max(Math.ceil(2*need*10)/10,0.1);
  const smax=parseFloat($('spring').max);if(N('spring')>smax)$('spring').value=smax;
  const sw_=sfrozen||{c:N('spring'),m:smax};$('sth').style.left=gS(N('spring'),sw_)*100+'%';$('sth').textContent=N('spring').toFixed(1);
  const pm=Math.max(N('pmax'),1);['pin','pout'].forEach(k=>{if(N(k)>pm)$(k).value=pm});
  const pi=N('pin'),po=N('pout'),lo=Math.min(pi,po),hi=Math.max(pi,po),sg=$('pT').firstElementChild;
  const px=v=>`calc(22px + (100% - 44px)*${v})`; // duimcentrum 22px van de rand, balk loopt volledig
  const w=frozen||win();$('thin').style.left=px(g(pi,w));$('thout').style.left=px(g(po,w));$('thin').textContent=pi.toFixed(1);$('thout').textContent=po.toFixed(1);
  sg.style.left=px(g(lo,w));sg.style.width='calc((100% - 44px)*'+(g(hi,w)-g(lo,w))+')';
  $('supplyv').textContent=N('supply').toFixed(1)+' bar';$('plugv').textContent=fr8(N('plug'))+'" '+Math.round(p)+' mm';$('seatv').textContent=N('seat').toFixed(1)+'% '+s.toFixed(1)+'mm';$('stemv').textContent=N('stem').toFixed(1)+'% '+t.toFixed(1)+'mm';
  const un=$('flow').value==='under',pu=un?'var(--hi)':'var(--lo)',pu4=un?'var(--hi4)':'var(--lo4)',po4=un?'var(--lo4)':'var(--hi4)';
  const bar=(id,i,w,col)=>{const b=$(id+'T').children[i];b.style.width=w+'%';b.style.background=col};
  bar('stem',0,N('seat'),po4);bar('stem',1,N('stem'),'#000'); // top view
  bar('seat',0,N('seat'),pu4);bar('seat',1,N('stem'),pu); // bottom view
  const fw=ffrozen||{c:N('fric'),m:FM};$('fth').style.left=gS(N('fric'),fw)*100+'%';$('fth').textContent=N('fric').toFixed(1);
  return {p,s,t};
}
function calc(){
  const d=dia(),As=Math.PI/4*d.s**2, Ast=Math.PI/4*d.t**2;
  const pin=N('pin'), pout=N('pout'); // P[MaxShutOff] telt niet mee in de krachten
  const under=$('flow').value==='under';
  const pU=under?pin:pout, pO=under?pout:pin, dP=Math.abs(pin-pout), k=0.1/1000;
  return {pU,pO,dP,under,F:{
    spring:($('fail').value==='open'?1:-1)*N('spring'), // + = openen
    stem:pU*Ast*k,
    seat:(under?1:-1)*dP*As*k}};
}

function arrow(s,x1,y1,x2,y2,col,sw=2.5,L=8,W=4){
  el(s,'line',{x1,y1,x2,y2,stroke:col,'stroke-width':sw});
  const a=Math.atan2(y2-y1,x2-x1),bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);
  el(s,'polygon',{points:`${x2},${y2} ${bx-W*Math.sin(a)},${by+W*Math.cos(a)} ${bx+W*Math.sin(a)},${by-W*Math.cos(a)}`,fill:col});
}

function sketch(c){
  const s=$('sketch');s.innerHTML='';
  const pu=c.under?'var(--hi)':'var(--lo)', po=c.under?'var(--lo)':'var(--hi)', ln={stroke:'var(--tx)','stroke-width':1.6,fill:'none'};
  // gietwerk: afgeronde S-vorm zoals op de foto
  el(s,'path',{d:'M22 192 C40 192 46 170 70 166 H130 C150 168 160 192 178 192 V246 C140 252 60 252 22 246 Z',fill:'var(--lg)',opacity:.55});
  // drukzones: onder de seat (inlaat-bowl) en boven/uitlaat
  const dU='M22 200 H64 C78 200 82 198 88 198 H112 C124 204 124 226 116 238 H22 Z';
  const dO='M64 168 H136 C158 168 166 184 178 200 V238 H116 C124 226 124 204 112 198 H88 C82 198 78 200 64 200 H34 C34 184 44 168 64 168 Z';
  el(s,'path',{d:dU,fill:pu,opacity:.4});el(s,'path',{d:dO,fill:po,opacity:.4});
  el(s,'path',{d:dU,...ln});el(s,'path',{d:dO,...ln});
  el(s,'path',{d:'M22 192 C40 192 46 170 70 166 M130 166 C150 168 160 192 178 192 M22 246 C60 252 140 252 178 246',...ln});
  el(s,'rect',{x:10,y:192,width:12,height:54,rx:3,fill:'var(--card)',stroke:'var(--tx)'});
  el(s,'rect',{x:178,y:192,width:12,height:54,rx:3,fill:'var(--card)',stroke:'var(--tx)'});
  // zitring + plug (gesloten)
  el(s,'rect',{x:84,y:198,width:4,height:7,rx:1,fill:'var(--mid)',stroke:'var(--tx)'});
  el(s,'rect',{x:112,y:198,width:4,height:7,rx:1,fill:'var(--mid)',stroke:'var(--tx)'});
  // plug zoals op de foto: cilinder met afgeronde schouder, bolle (halfellips) onderkant die op de seat rust
  el(s,'path',{d:'M86 177 Q86 172 91 172 H109 Q114 172 114 177 V190 A14 16 0 0 1 86 190 Z',fill:'var(--mid)',stroke:'var(--tx)','stroke-linejoin':'round'});
  // bonnet, stem, yoke, actuator
  el(s,'rect',{x:72,y:154,width:8,height:8,rx:1,fill:'var(--mid)',stroke:'var(--tx)'});
  el(s,'rect',{x:120,y:154,width:8,height:8,rx:1,fill:'var(--mid)',stroke:'var(--tx)'});
  el(s,'rect',{x:66,y:160,width:68,height:10,rx:3,fill:'var(--card)',stroke:'var(--tx)'});
  el(s,'rect',{x:82,y:122,width:36,height:38,rx:5,fill:'var(--card)',stroke:'var(--tx)'});
  el(s,'rect',{x:88,y:112,width:24,height:10,rx:3,fill:'var(--mid)',stroke:'var(--tx)'});
  el(s,'path',{d:'M74 162 V72 M126 162 V72',...ln});
  const sw=Math.max(1.5,28*N('stem')/100); // stembreedte t.o.v. plug (28 breed in tekening)
  el(s,'rect',{x:100-sw/2,y:46,width:sw,height:126,fill:'var(--mid)',stroke:'var(--tx)'});
  el(s,'rect',{x:55,y:20,width:90,height:52,rx:8,fill:'var(--card)',stroke:'var(--tx)','stroke-width':1.6});
  el(s,'path',{d:'M57 46 Q100 40 143 46',...ln});
  // veer in actuator: Fail Close = bovenkamer, Fail Open = onderkamer
  const fo=$('fail').value==='open',y0=fo?49:23,y1=fo?70:41;
  let sp='M100 '+y0;for(let i=1;i<=6;i++)sp+=' L'+(i%2?80:120)+' '+(y0+(y1-y0)*i/7);sp+=' L100 '+y1;
  el(s,'path',{d:sp,fill:'none',stroke:'var(--neg)','stroke-width':1.8});
  if(fo)el(s,'rect',{x:100-sw/2,y:44,width:sw,height:28,fill:'var(--mid)',stroke:'var(--tx)'});
  // veerkracht-pijl (+ = omhoog = open)
  const open=$('fail').value==='open';
  arrow(s,160,open?110:50,160,open?50:110,'var(--neg)');
  el(s,'text',{x:160,y:122,'text-anchor':'middle','font-size':9,fill:'var(--tx)'},'Spring');
  el(s,'text',{x:160,y:132,'text-anchor':'middle','font-size':9,fill:'var(--mu)'},'Fail '+(open?'Open':'Close'));
  // flowpijlen en labels
  const r=c.under;
  if(r){arrow(s,1,219,18,219,'var(--tx)');arrow(s,182,219,199,219,'var(--tx)')}
  else{arrow(s,199,219,182,219,'var(--tx)');arrow(s,18,219,1,219,'var(--tx)')}
  el(s,'text',{x:16,y:260,'text-anchor':'middle','font-size':9,fill:'var(--mu)'},r?'IN':'OUT');
  el(s,'text',{x:184,y:260,'text-anchor':'middle','font-size':9,fill:'var(--mu)'},r?'OUT':'IN');
  el(s,'text',{x:100,y:260,'text-anchor':'middle','font-size':9,fill:'var(--tx)'},'Flow '+(r?'Under':'Over'));
  el(s,'text',{x:34,y:228,'font-size':8,fill:'var(--tx)'},'P under '+c.pU);
  el(s,'text',{x:38,y:192,'font-size':8,fill:'var(--tx)'},'P over '+c.pO);
}

function circles(c){
  const d=dia(),dP=d.p,dS=d.s,dT=d.t,sc=158/Math.max(dP,1);
  const pu=c.under?'var(--hi)':'var(--lo)', pu4=c.under?'var(--hi4)':'var(--lo4)', po4=c.under?'var(--lo4)':'var(--hi4)';
  const t=$('top'),b=$('bot');t.innerHTML='';b.innerHTML='';
  el(t,'circle',{cx:100,cy:100,r:dP/2*sc,fill:'var(--lg)',stroke:'var(--tx)'});
  el(t,'circle',{cx:100,cy:100,r:dS/2*sc,fill:po4,stroke:'var(--tx)'});
  el(t,'circle',{cx:100,cy:100,r:dT/2*sc,fill:'#000',stroke:'var(--tx)'});
  el(b,'circle',{cx:100,cy:100,r:dP/2*sc,fill:'var(--lg)',stroke:'var(--tx)'});
  el(b,'circle',{cx:100,cy:100,r:dS/2*sc,fill:pu4,stroke:'var(--tx)'});
  el(b,'circle',{cx:100,cy:100,r:dT/2*sc,fill:pu,stroke:'var(--tx)'});
}

let flip=false,lastFail='';
function wf(s,c,W,H,mini){ // waterfall; mini = kleine overlay op de xy-grafiek (scherm 2)

function sym(id,min,max){ // symmetrische slider: balkbreedte = % van plug (track = plug)
  const inp=$(id),t=$(id+'T');
  const set=e=>{const r=t.getBoundingClientRect(),w=Math.abs(e.clientX-(r.left+r.width/2))*2/r.width*100;inp.value=Math.round(Math.min(max,Math.max(min,w))*10)/10;update()};

  t.addEventListener('pointermove',e=>{if(t.hasPointerCapture(e.pointerId))set(e)});
}

function dual(){ // 1 slider met 2 handles: P in (rood) en P out (blauw), max = P max shut off
  const t=$('pT');let act=null;

  t.addEventListener('pointerdown',e=>{frozen=win();const v=val(e),a=Math.abs(v-N('pin')),b=Math.abs(v-N('pout'));act=a<b?'pin':b<a?'pout':(v>N('pin')?'pin':'pout');t.setPointerCapture(e.pointerId);set(e)});

// spring-slider: niet-lineair, gekozen waarde altijd in het midden (wortelschaal rond de waarde)

// scherm 2: P[in] (x) tegen P[out] (y), kleur = safety factor in de gekozen richting
let TG=null,TGm=null;
function xy(cv,W,H,mini){ // P[in] (x) tegen P[out] (y); mini = kleine overlay op de waterfall

  const tx=getComputedStyle(document.body).color;

  const rect=!mini&&document.body.classList.contains('wide');

  g.font=(mini?8:11)+'px system-ui,sans-serif';const dg=pm%1?1:0,ty=y0+SY+(mini?9:13);

    [0,.5,1].forEach(f=>{const yy=f===1?y0+11:f===0?y0+SY-4:y0+SY/2+4,s=(f*pm).toFixed(dg);g.strokeText(s,x0+3,yy);g.fillText(s,x0+3,yy)});
    g.strokeStyle=tx;g.lineWidth=1}
